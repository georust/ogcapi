[workspace]
resolver = "3"

members = [
    "ogcapi",
    "ogcapi-client",
    "ogcapi-drivers",
    "ogcapi-processes",
    "ogcapi-services",
    "ogcapi-types",
    "examples/*",
]
exclude = ["examples/*"]
default-members = ["ogcapi"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/georust/ogcapi"
edition = "2024"
categories = ["science::geo"]
keywords = ["geography", "geo", "geospatial", "gis", "api"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
geojson = { version = "1.0", default-features = false }
jsonfg = { version = "0.1", default-features = false }
log = "0.4.29"
serde = "1.0"
serde_json = "1.0"
serde_qs = "1.1"
thiserror = "2.0"
url = "2.5"
utoipa = "5.5"

[workspace.lints.clippy]
# Set group priorities to -1 so individual lints (default priority 0) override them cleanly
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# disable some pedantic lints
default_trait_access = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
non_ascii_literal = "allow"
option_if_let_else = "allow"
similar_names = "allow"
wildcard_imports = "allow"

# enable some restriction lints
dbg_macro = "warn"
exit = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

# disable some cargo lints
multiple_crate_versions = "allow"
