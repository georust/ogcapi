services:
  db:
    image: docker.io/postgis/postgis
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - ${DB_PORT}:5432

  server:
    init: true
    build:
      context: .
    container_name: ogcapi
    environment:
      RUST_LOG: ${RUST_LOG}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_CUSTOM_ENDPOINT: http://rustfs:9000
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    volumes:
      - ./data:/data
      - ./ogcapi/src:/app/ogcapi/src:ro
      - ./ogcapi/Cargo.toml:/app/ogcapi/Cargo.toml:ro
      - ./ogcapi-client/src:/app/ogcapi-client/src:ro
      - ./ogcapi-client/Cargo.toml:/app/ogcapi-client/Cargo.toml:ro
      - ./ogcapi-drivers/src:/app/ogcapi-drivers/src:ro
      - ./ogcapi-drivers/Cargo.toml:/app/ogcapi-drivers/Cargo.toml:ro
      - ./ogcapi-drivers/migrations:/app/ogcapi-drivers/migrations:ro
      - ./ogcapi-services/src:/app/ogcapi-services/src:ro
      - ./ogcapi-services/Cargo.toml:/app/ogcapi-services/Cargo.toml:ro
      - ./ogcapi-types:/app/ogcapi-types:ro
    depends_on:
      db:
        condition: service_healthy
    command: tail -f /dev/null
    ports:
      - ${APP_PORT}:${APP_PORT}

  rustfs:
    image: docker.io/rustfs/rustfs
    container_name: rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs:/data
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:9000/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 9000:9000
      - 9001:9001

  rustfs-init:
    image: docker.io/amazon/aws-cli
    container_name: rustfs-init
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws s3 mb s3://${AWS_S3_BUCKET_NAME}
        aws s3api put-bucket-policy --bucket ${AWS_S3_BUCKET_NAME} --policy '{
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": ["*"]},
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::${AWS_S3_BUCKET_NAME}/*"]
          }]
        }'
        exit 0

volumes:
  rustfs:
