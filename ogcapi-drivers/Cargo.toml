[package]
name = "ogcapi-drivers"
version = "0.3.0"
description = "Driver traits and implementations"
license.workspace = true
repository.workspace = true
edition.workspace = true
categories.workspace = true
keywords.workspace = true

include = ["/src", "/migrations"]

[features]
default = ["common", "edr", "features", "processes", "tiles"]

# drivers
object = [
    "common",
    "dep:chrono",
    "dep:futures",
    "dep:geojson",
    "dep:object_store",
    "dep:serde",
    "dep:url",
    "dep:uuid",
]
s3 = ["object", "object_store/aws"]
postgres = ["dep:sqlx", "dep:rink-core", "dep:url"]

# standards
common = ["ogcapi-types/common"]
edr = ["common", "ogcapi-types/edr"]
features = ["common", "ogcapi-types/features"]
processes = ["common", "ogcapi-types/processes"]
stac = ["features", "ogcapi-types/stac"]
styles = ["ogcapi-types/styles"]
tiles = ["common", "ogcapi-types/tiles"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4.44", optional = true, default-features = false, features = ["clock"] }
futures = { version = "0.3.32", optional = true }
geojson = { workspace = true, optional = true }
object_store = { version = "0.13.2", optional = true }
serde = { workspace = true, optional = true }
log = { workspace = true }
rink-core = { version = "0.8.0", optional = true, features = ["bundle-files"] }
serde_json = { workspace = true }
sqlx = { version = "0.8.6", optional = true, features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "migrate",
] }
url = { workspace = true, optional = true }
uuid = { version = "1.23", optional = true, features = ["v4"] }

ogcapi-types = { path = "../ogcapi-types", version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1.51", default-features = false, features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
